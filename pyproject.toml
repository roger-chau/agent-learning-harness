[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groundwork"
version = "0.1.0"
description = "Deep, hands-on courses that rebuild a subject from first principles, with a GPU simulator, in-page terminal and gated practice."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=2.12",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
groundwork = "learnharness.server:main"

[tool.setuptools.packages.find]
include = ["learnharness*"]

[tool.setuptools.package-data]
learnharness = ["static/*", "static/sim/*", "static/vendor/*", "static/vendor/katex/*", "static/vendor/katex/fonts/*"]
